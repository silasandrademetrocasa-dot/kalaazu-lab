
name: Kalaazu LAB - Headless smoke test

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: kalaazu
          MARIADB_USER: kalaazu_ci
          MARIADB_PASSWORD: ci-app-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: kalaazu
      MYSQL_USERNAME: kalaazu_ci
      MYSQL_PASSWORD: ci-app-only
      SPRING_PROFILES_ACTIVE: lab
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      AUTO_START: 'false'
      WEB_SERVER_PORT: '8081'

    steps:
      - name: Checkout isolated lab
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Import SQL in temporary MariaDB
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.mariadb.id }}" \
            mariadb -u root -pci-root-only \
            < Persistence/database/dump.sql

          tables=$(docker exec \
            "${{ job.services.mariadb.id }}" \
            mariadb -N -s -u root -pci-root-only \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='kalaazu';")

          echo "Imported tables: $tables"
          test "$tables" -gt 0

      - name: Start headless server
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          ./gradlew run --no-daemon --stacktrace \
            > headless.log 2>&1 &

          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/8081) \
                >/dev/null 2>&1; then
              echo "SUCCESS: HTTP server listening on 8081"
              exit 0
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application stopped unexpectedly"
              tail -n 160 headless.log
              exit 1
            fi

            sleep 2
          done

          echo "Timeout waiting for server"
          tail -n 160 headless.log
          exit 1

      - name: Show diagnostic logs
        if: always()
        shell: bash
        run: tail -n 160 headless.log || true
