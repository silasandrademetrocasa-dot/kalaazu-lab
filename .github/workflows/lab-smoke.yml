
name: Kalaazu LAB - Headless smoke test

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: kalaazu
          MARIADB_USER: kalaazu_ci
          MARIADB_PASSWORD: ci-app-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: kalaazu
      MYSQL_USERNAME: kalaazu_ci
      MYSQL_PASSWORD: ci-app-only

      SPRING_PROFILES_ACTIVE: lab
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      AUTO_START: 'false'
      WEB_SERVER_PORT: '8081'

    steps:
      # 1. Baixar o projeto isolado
      - name: Checkout isolated lab
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 3. Importar banco temporario
      - name: Import SQL in temporary MariaDB
        shell: bash
        run: |
          set -euo pipefail

          docker exec -i "${{ job.services.mariadb.id }}" \
            mariadb -u root -pci-root-only \
            < Persistence/database/dump.sql

          tables=$(docker exec \
            "${{ job.services.mariadb.id }}" \
            mariadb -N -s -u root -pci-root-only \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='kalaazu';")

          echo "Imported tables: $tables"

          if [ "$tables" -le 0 ]; then
            echo "ERROR: Database has no tables"
            exit 1
          fi

          echo "Database import completed successfully"

      # 4. Iniciar o servidor sem interface grafica
      - name: Start headless server
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "Starting Kalaazu headless server..."

          ./gradlew run --no-daemon --stacktrace \
            > headless.log 2>&1 &

          app_pid=$!

          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 90); do

            if (echo > /dev/tcp/127.0.0.1/8081) \
                >/dev/null 2>&1; then

              echo "SUCCESS: HTTP server listening on port 8081"

              curl -s -o /dev/null \
                -w "HTTP status: %{http_code}\n" \
                http://127.0.0.1:8081/ || true

              exit 0
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then

              echo "ERROR: Application stopped unexpectedly"
              echo "Check the detailed startup logs below"

              exit 1
            fi

            sleep 2
          done

          echo "ERROR: Timeout waiting for server"

          exit 1

      # 5. Diagnostico detalhado
      - name: Show detailed startup errors
        if: always()
        shell: bash
        run: |
          if [ -f headless.log ]; then

            echo "===================================="
            echo "KALAAZU LAB - STARTUP DIAGNOSTIC"
            echo "===================================="

            echo ""
            echo "=== STARTUP ERRORS ==="

            grep -nEi \
              'Schema-validation|Caused by:|ERROR|Exception|missing table|missing column|wrong column type|SchemaManagementException|APPLICATION FAILED' \
              headless.log | head -n 120 || true

            echo ""
            echo "=== STARTUP LOG BEGINNING ==="

            sed -n '1,200p' headless.log

            echo ""
            echo "=== STARTUP LOG END ==="

            tail -n 100 headless.log

            echo ""
            echo "=== DIAGNOSTIC FINISHED ==="

          else
            echo "No startup log generated"
          fi

      # 6. Salvar log caso ocorra falha
      - name: Upload startup diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kalaazu-startup-log
          path: headless.log
          if-no-files-found: ignore
          retention-days: 3
