
name: Kalaazu LAB - Universe test

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: kalaazu
          MARIADB_USER: kalaazu_ci
          MARIADB_PASSWORD: ci-app-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: kalaazu
      MYSQL_USERNAME: kalaazu_ci
      MYSQL_PASSWORD: ci-app-only

      SPRING_PROFILES_ACTIVE: lab
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      AUTO_START: 'true'
      GAME_VERSION: V4
      WEB_SERVER_PORT: '8081'
      GAME_SERVER_PORT: '8080'
      POLICY_SERVER_PORT: '1843'

    steps:

      # FASE 1 - PREPARAR AMBIENTE
      - name: Checkout Kalaazu LAB
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # FASE 2 - PREPARAR BANCO DE DADOS
      - name: Import and prepare temporary database
        shell: bash
        run: |
          set -euo pipefail

          echo "=== IMPORTING KALAAZU DATABASE ==="

          docker exec -i "${{ job.services.mariadb.id }}" \
            mariadb -u root -pci-root-only \
            < Persistence/database/dump.sql

          echo "=== FIXING LEGACY SETTINGS SCHEMA ==="

          # Exclusivo do MariaDB descartavel deste job.
          docker exec "${{ job.services.mariadb.id }}" \
            mariadb -u root -pci-root-only \
            -e "DROP TABLE IF EXISTS kalaazu.accounts_settings;"

          docker exec -i "${{ job.services.mariadb.id }}" \
            mariadb -u root -pci-root-only kalaazu \
            < Persistence/database/accounts_settings/structure.sql

          echo "=== VERIFYING DATABASE ==="

          tables=$(docker exec \
            "${{ job.services.mariadb.id }}" \
            mariadb -N -s -u root -pci-root-only \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='kalaazu';")

          echo "Imported tables: $tables"
          test "$tables" -eq 88

          settings_columns=$(docker exec \
            "${{ job.services.mariadb.id }}" \
            mariadb -N -s -u root -pci-root-only \
            -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='kalaazu' AND table_name='accounts_settings';")

          echo "Settings columns: $settings_columns"
          test "$settings_columns" -gt 20

          echo "SUCCESS: Database schema prepared"

      # FASE 3 - INICIAR UNIVERSO
      - name: Start universe and connect pilot
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "=== STARTING KALAAZU UNIVERSE ==="

          ./gradlew run --no-daemon --console=plain \
            > universe.log 2>&1 &

          app_pid=$!

          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          port_open() {
            (echo > "/dev/tcp/127.0.0.1/$1") \
              >/dev/null 2>&1
          }

          ready=false

          for attempt in $(seq 1 150); do

            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "FAIL: Application exited"
              exit 1
            fi

            if port_open 8081 && \
               port_open 8080 && \
               port_open 1843 && \
               grep -Eq \
                 'Initialized map .* with 80 npcs, 100 collectables' \
                 universe.log; then

              ready=true
              break
            fi

            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "FAIL: Universe startup timeout"
            exit 1
          fi

          echo "=== UNIVERSE INITIALIZED ==="
          echo "HTTP port: 8081 OK"
          echo "Game port: 8080 OK"
          echo "Policy port: 1843 OK"
          echo "Map 1: 80 NPCs and 100 collectables"

          # FASE 4 - CADASTRAR PILOTO
          echo "=== TESTING PLAYER REGISTRATION ==="

          TEST_USER="p${GITHUB_RUN_ID}"

          REGISTER_BODY=$(jq -nc --arg u "$TEST_USER" \
            '{username:$u,password:"LabOnly12345!",email:($u+"@example.com")}')

          REGISTER_RESPONSE=$(curl -fsS --max-time 30 \
            -H "Content-Type: application/json" \
            -d "$REGISTER_BODY" \
            http://127.0.0.1:8081/external/register)

          if ! echo "$REGISTER_RESPONSE" | \
            jq -e '.status == "OK"' >/dev/null; then

            echo "FAIL: Pilot registration"

            echo "$REGISTER_RESPONSE" | \
              jq -r '.message // "Unknown error"'

            exit 1
          fi

          echo "SUCCESS: Pilot registered"

          # FASE 5 - AUTENTICAR PILOTO
          echo "=== TESTING PLAYER LOGIN ==="

          LOGIN_BODY=$(jq -nc --arg u "$TEST_USER" \
            '{username:$u,password:"LabOnly12345!"}')

          LOGIN_RESPONSE=$(curl -fsS --max-time 30 \
            -H "Content-Type: application/json" \
            -d "$LOGIN_BODY" \
            http://127.0.0.1:8081/external/login)

          if ! echo "$LOGIN_RESPONSE" | \
            jq -e '.status == "OK"' >/dev/null; then

            echo "FAIL: Pilot authentication"

            echo "$LOGIN_RESPONSE" | \
              jq -r '.message // "Unknown error"'

            exit 1
          fi

          echo "SUCCESS: Pilot authentication completed"

          # FASE 6 - VALIDAR CONFIGURACOES DO PILOTO
          echo "=== VERIFYING PLAYER SETTINGS ==="

          ACCOUNT_ID=$(echo "$LOGIN_RESPONSE" | \
            jq -er '.data.account.id')

          SESSION_ID=$(echo "$LOGIN_RESPONSE" | \
            jq -er '.data.account.sessionId')

          if ! [[ "$ACCOUNT_ID" =~ ^[0-9]+$ ]]; then
            echo "FAIL: Invalid account ID"
            exit 1
          fi

          if ! [[ "$SESSION_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "FAIL: Invalid session ID"
            exit 1
          fi

          USER_ID=$(docker exec \
            "${{ job.services.mariadb.id }}" \
            mariadb -N -s -u root -pci-root-only \
            -e "SELECT users_id FROM kalaazu.accounts WHERE id=${ACCOUNT_ID} LIMIT 1;")

          if ! [[ "$USER_ID" =~ ^[0-9]+$ ]]; then
            echo "FAIL: Could not resolve user ID"
            exit 1
          fi

          settings_count=$(docker exec \
            "${{ job.services.mariadb.id }}" \
            mariadb -N -s -u root -pci-root-only \
            -e "SELECT COUNT(*) FROM kalaazu.accounts_settings WHERE accounts_id=${ACCOUNT_ID} AND version='V4';")

          echo "V4 settings records: $settings_count"

          if [ "$settings_count" -lt 1 ]; then
            echo "FAIL: Missing V4 player settings"
            echo "Check RegisterService.createSettings()"
            exit 1
          fi

          echo "SUCCESS: Pilot identity and settings validated"

          # FASE 7 - CONECTAR AO SERVIDOR TCP
          echo "=== TESTING GAME TCP LOGIN ==="

          TCP_USER_ID="$USER_ID" \
          TCP_SESSION_ID="$SESSION_ID" \
          python3 - <<'PY'
          import os
          import socket
          import time

          user_id = os.environ["TCP_USER_ID"]
          session_id = os.environ["TCP_SESSION_ID"]

          address = ("127.0.0.1", 8080)

          print("Connecting to game server...", flush=True)

          with socket.create_connection(
              address, timeout=10
          ) as connection:

              connection.settimeout(15)

              login = (
                  f"LOGIN|{user_id}|{session_id}|V4"
              ).encode("utf-8") + b"\n\x00"

              connection.sendall(login)

              print("TCP LOGIN packet submitted", flush=True)

              response = connection.recv(8192)

              if not response:
                  raise RuntimeError(
                      "Game server returned empty response"
                  )

              print(
                  "SUCCESS: Initial game response received",
                  flush=True
              )

              connection.sendall(b"RDY\n\x00")

              print("RDY packet submitted", flush=True)

              time.sleep(5)

          print("TCP test sequence completed", flush=True)
          PY

          # FASE 8 - VALIDAR ENTRADA NO MAPA
          echo "=== VERIFYING PLAYER MAP INITIALIZATION ==="

          player_ready=false

          for attempt in $(seq 1 20); do

            if grep -Fq \
              "Initializing player ${ACCOUNT_ID}" \
              universe.log; then

              player_ready=true
              break
            fi

            sleep 1
          done

          if [ "$player_ready" != "true" ]; then
            echo "FAIL: Player initialization not confirmed"
            exit 1
          fi

          echo "SUCCESS: Player initialization confirmed"
          echo "=== KALAAZU LAB TCP TEST COMPLETED ==="

      # FASE 9 - DIAGNOSTICOS
      - name: Universe diagnostics
        if: always()
        shell: bash
        run: |
          if [ -f universe.log ]; then

            echo "=== IMPORTANT EVENTS ==="

            grep -nEi \
              'Initialized map|Initializing player|Loading maps|Starting .*server|Started game server|Connection received|Connection closed|Packet received|Failed to handle packet|SettingsCommandBuilder|NoSuchElementException|Exception|ERROR|Caused by' \
              universe.log | tail -n 120 || true

            echo "=== LAST LOG LINES ==="

            tail -n 120 universe.log

          else
            echo "No universe log generated"
          fi

      # FASE 10 - SALVAR LOGS DE FALHAS
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kalaazu-universe-diagnostics
          path: universe.log
          if-no-files-found: ignore
          retention-days: 3
