name: Kalaazu LAB - HTML5 bridge test

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: kalaazu
          MARIADB_USER: kalaazu_ci
          MARIADB_PASSWORD: ci-app-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: kalaazu
      MYSQL_USERNAME: kalaazu_ci
      MYSQL_PASSWORD: ci-app-only
      SPRING_PROFILES_ACTIVE: lab
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AUTO_START: 'true'
      GAME_VERSION: V4
      WEB_SERVER_PORT: '8081'
      GAME_SERVER_PORT: '8080'
      POLICY_SERVER_PORT: '1843'
      BRIDGE_BIND: '127.0.0.1'
      BRIDGE_PORT: '8090'
      KALAAZU_HTTP: 'http://127.0.0.1:8081'
      KALAAZU_GAME_HOST: '127.0.0.1'
      KALAAZU_GAME_PORT: '8080'

    steps:
      - name: Checkout Kalaazu LAB
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gateway dependencies in runner only
        run: python -m pip install -r gateway/requirements.txt

      - name: Check local bridge protocol (no Java needed)
        run: python tests/test_bridge.py

      - name: Import isolated lab database
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.mariadb.id }}" \
            mariadb -u root -pci-root-only < Persistence/database/dump.sql
          docker exec "${{ job.services.mariadb.id }}" \
            mariadb -u root -pci-root-only \
            -e "DROP TABLE IF EXISTS kalaazu.accounts_settings;"
          docker exec -i "${{ job.services.mariadb.id }}" \
            mariadb -u root -pci-root-only kalaazu \
            < Persistence/database/accounts_settings/structure.sql
          tables=$(docker exec "${{ job.services.mariadb.id }}" \
            mariadb -N -s -u root -pci-root-only \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='kalaazu';")
          echo "Tables imported: $tables"
          test "$tables" -eq 88

      - name: Test Java V4 through real HTML5 gateway
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew run --no-daemon --console=plain > universe.log 2>&1 &
          java_pid=$!
          python gateway/main.py > bridge.log 2>&1 &
          bridge_pid=$!
          trap 'kill "$java_pid" "$bridge_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 150); do
            if ! kill -0 "$java_pid" 2>/dev/null; then
              echo "Java process exited"; exit 1
            fi
            if ! kill -0 "$bridge_pid" 2>/dev/null; then
              echo "Bridge process exited"; exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null && \
               (echo > /dev/tcp/127.0.0.1/8081) 2>/dev/null && \
               (echo > /dev/tcp/127.0.0.1/8090) 2>/dev/null && \
               grep -q 'Initialized map 1-1' universe.log; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "FAIL: Startup timeout"; exit 1
          fi

          python tests/test_live_java.py
          grep -q 'Initializing player' universe.log
          echo "SUCCESS: Server-side player appeared in map 1-1"

      - name: Diagnostics (without account/session dump)
        if: always()
        shell: bash
        run: |
          echo '=== BRIDGE ==='
          if [ -f bridge.log ]; then tail -n 60 bridge.log; fi
          echo '=== JAVA EVENT TYPES (sensitive tokens redacted) ==='
          if [ -f universe.log ]; then
            grep -E 'Initialized map|Initializing player|Started game server|Failed to handle packet|Exception|ERROR' universe.log \
              | sed -E 's/session(ID|Id)?[=: ]+[a-fA-F0-9]{32}/session=[REDACTED]/g' \
              | tail -n 65 || true
          fi
