
name: Kalaazu LAB - Build and ZIP

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout isolated repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build distributions
        run: |
          chmod +x ./gradlew
          ./gradlew clean assemble --no-daemon --stacktrace

      - name: Verify generated ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t archives < <(
            find build/distributions -maxdepth 1 \
              -type f -name '*.zip' | sort
          )

          if [ ${#archives[@]} -eq 0 ]; then
            echo 'No distribution ZIP found' >&2
            exit 1
          fi

          for archive in "${archives[@]}"; do
            unzip -t "$archive" | tail -n 1
            ls -lh "$archive"
          done

          echo "## Kalaazu LAB ZIP ready" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: kalaazu-lab-package
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 7
