name: Kalaazu LAB - Build diagnosis
'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check Java
        run: java -version
      - name: Check Gradle
        run: chmod +x ./gradlew && ./gradlew --version
      - name: Compile Kalaazu
        run: ./gradlew assemble --no-daemon --stacktrace
